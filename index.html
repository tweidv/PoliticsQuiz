<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablet Quiz App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Landing Page -->
        <div id="landing-page" class="page active">
            <div class="container">
                <div class="welcome-card">
                    <h1>Quizzes</h1>
                    
                    <div class="quiz-topics">
                        <button class="topic-btn" data-topic="migration">
                            <span class="topic-icon">🌍</span>
                            <span class="topic-title">Migration</span>
                            <span class="topic-count">7 questions</span>
                        </button>
                        <button class="topic-btn" data-topic="ai">
                            <span class="topic-icon">🤖</span>
                            <span class="topic-title">AI & Automation</span>
                            <span class="topic-count">7 questions</span>
                        </button>
                        <button class="topic-btn" data-topic="tax">
                            <span class="topic-icon">💰</span>
                            <span class="topic-title">UK Tax Money</span>
                            <span class="topic-count">8 questions</span>
                        </button>
                        <button class="topic-btn" data-topic="speech">
                            <span class="topic-icon">🗣️</span>
                            <span class="topic-title">Free Speech</span>
                            <span class="topic-count">6 questions</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question Page -->
        <div id="question-page" class="page">
            <div class="container">
                <div class="quiz-card">
                    <div class="progress-section">
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                        <div class="progress-text">Question <span id="current-question">1</span> of <span id="total-questions">7</span></div>
                    </div>
                    
                    <div class="question-section">
                        <h2 id="question-text">What was the UK's net migration for the year ending December 2024?</h2>
                        <p id="question-subtext">Use the slider to make your guess</p>
                    </div>
                    
                    <div class="slider-section">
                        <div class="slider-container">
                            <input type="range" id="answer-slider" min="0" max="1000000" step="1000" value="500000">
                            <div class="slider-labels">
                                <span id="min-label">0</span>
                                <span id="max-label">1,000,000</span>
                            </div>
                        </div>
                        <div class="slider-value">
                            <span id="slider-value">500,000</span>
                        </div>
                    </div>
                    
                    <div class="countdown-section">
                        <div class="countdown-circle">
                            <svg class="countdown-svg" viewBox="0 0 100 100">
                                <circle class="countdown-bg" cx="50" cy="50" r="45"></circle>
                                <circle class="countdown-progress" cx="50" cy="50" r="45"></circle>
                            </svg>
                            <div class="countdown-text">
                                <span id="countdown-timer">5</span>
                            </div>
                        </div>
                    </div>
                    
                    <div id="answer-section" class="answer-section" style="display: none;">
                        <div class="answer-display">
                            <h3>Answer Revealed!</h3>
                            <div class="answer-comparison">
                                <div class="answer-item">
                                    <span class="answer-label">Your Answer:</span>
                                    <span id="user-answer-display" class="answer-value">500,000</span>
                                </div>
                                <div class="answer-item">
                                    <span class="answer-label">Correct Answer:</span>
                                    <span id="correct-answer-display" class="answer-value correct">431,000</span>
                                </div>
                                <div class="answer-item">
                                    <span class="answer-label">Accuracy:</span>
                                    <span id="accuracy-display" class="answer-value accuracy">85%</span>
                                </div>
                            </div>
                            <div class="sources-section">
                                <h4>Sources:</h4>
                                <ul id="sources-list">
                                    <!-- Sources will be populated by JavaScript -->
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <div class="button-section">
                        <button id="next-btn" class="btn btn-primary" disabled>Next</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Page -->
        <div id="results-page" class="page">
            <div class="container">
                <div class="results-card">
                    <h1>🎯 Quiz Results</h1>
                    <div class="overall-score">
                        <div class="score-circle">
                            <span id="overall-accuracy">85%</span>
                            <div class="score-label">Accuracy</div>
                        </div>
                    </div>
                    
                    <div class="results-summary">
                        <h3>Your Answers</h3>
                        <div id="results-list" class="results-list">
                            <!-- Results will be populated by JavaScript -->
                        </div>
                    </div>
                    
                    <div class="results-actions">
                        <button id="home-btn" class="btn btn-primary">🏠 Home</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
